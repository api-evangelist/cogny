    detail: >-
      Cogny publishes one npm package and it is a CLI, not a client library.
      There is no JavaScript, Python, Go, Ruby, Java or .NET SDK for the REST API
      or for the MCP surface. Integrators hand-roll HTTP against
      https://api.cogny.com/v1 or drive the platform through MCP/the CLI. For an
      agent-native provider that is a defensible posture, but it does mean the
