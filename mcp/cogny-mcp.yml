  evidence:
    request: 'POST https://app.cogny.com/mcp {"jsonrpc":"2.0","id":1,"method":"tools/list"}'
    http_status: 401
    body: >-
      {"jsonrpc":"2.0","id":1,"error":{"code":-32603,"message":"Authentication
      required. Connect via OAuth to use this MCP server."}}
  note: >-
    Remote-only: an MCP client POSTs directly to the hosted endpoint. There is no
    stdio package — @cogny/cli is a CLI wrapper over the same remote server
    (cogny-mcp-proxy), not a locally-run MCP server, so mode stays `remote`. The
    repository https://github.com/cognyai/claude-code-marketing-skills ships an
    .mcp.json.example that wires the endpoint by URL, confirming the remote shape.
