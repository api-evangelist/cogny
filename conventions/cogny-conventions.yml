  endpoint: GET /v1/reports/{report_id}/stream
  event_types: [status, query, result, insight, visualization, completed, error]
versioning:
  scheme: uri-path
  current: v1
  base_url: https://api.cogny.com/v1
idempotency:
  supported: false
