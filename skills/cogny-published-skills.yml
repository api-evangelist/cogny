summary: >-
  Cogny publishes 53 Agent Skills in a public GitHub repository — a first-party
  Agent Skill library, not skills this pipeline authored. This is the strongest
  agent-surface artifact Cogny ships after the MCP server itself: the skills are
  the packaged operating instructions that drive Cogny's ~50 MCP tools, and a
  meaningful subset run with no Cogny account at all.
skill_count: 53
tiering:
  model: free-and-premium
  free: >-
    Roughly half the library runs on web search and public data with no Cogny
    account — the reference skills (GA4 BigQuery schema, GA4 events, GTM setup,
    GAQL, UTM, structured data, Core Web Vitals, Google Ads Scripts, Meta CAPI)
    plus the generative ones (ad copy, landing-page review, competitor analysis,
    lead qualification, welcome series, PMax launch kit).
  premium: >-
    The audit and monitor skills bind to live channel data through the Cogny MCP
    server and require the $9/mo Solo tier (Search Console, Bing, LinkedIn Ads,
    Google Ads, Meta Ads, GA4, GTM, HubSpot, ESPs).
  source: https://github.com/cognyai/claude-code-marketing-skills#readme
install:
  one_liner: curl -sSL https://raw.githubusercontent.com/cognyai/claude-code-marketing-skills/main/install.sh | bash
  manual_claude_code: cp -r claude-code-marketing-skills/skills/* .claude/skills/
  manual_codex: cp -r claude-code-marketing-skills/skills/* "${CODEX_HOME:-$HOME/.codex}/skills/"
  targets: [Claude Code, Cursor, Windsurf, Codex]
  mcp_wiring:
    file: .mcp.json.example
    config: '{"mcpServers":{"cogny":{"type":"http","url":"https://app.cogny.com/mcp"}}}'
    note: >-
      The repo ships an .mcp.json.example that wires the remote Cogny MCP server
      by URL — consistent with mcp/cogny-mcp.yml deployment.mode = remote.
