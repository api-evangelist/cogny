aid: cogny
name: Cogny
description: >-
  Cogny is a Stockholm-based AI marketing platform (Cogny AB) that runs marketing
  analytics and automation on autopilot for marketers and data teams. It connects
  ad accounts and data warehouses (Google BigQuery, Google Ads, Meta Ads, LinkedIn,
  GA4, Search Console, TikTok, X, Mailchimp and more) to any MCP-capable coding
  agent, exposing ~50 Model Context Protocol tools plus a REST API for AI-generated
  growth reports (with SSE streaming) and growth tickets. Cogny is deeply
  agent-native: a one-command install manifest (SKILL.md), an auth.md registration
  handshake that issues anonymous cogny_lite_* API keys with no browser bounce, an
  @cogny/cli, a public library of 53 first-party Agent Skills, and machine-readable
  llms.txt and .well-known discovery surfaces.
