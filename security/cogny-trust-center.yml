  source: https://cogny.com/security
security_controls:
  encryption_in_transit: TLS (HTTPS) for all data, including service-to-service
  encryption_at_rest: Supabase-encrypted database; OAuth tokens in Supabase Vault
  authentication: Supabase Auth (email/password + social login)
  third_party_oauth: OAuth 2.0 with HMAC signature verification on callbacks and webhooks
  tenant_isolation: >-
    Postgres Row-Level Security on all tables, scoped to the authenticated user's
    warehouse; stated that cross-tenant access is not possible at the DB layer.
  secret_handling: >-
    Access and refresh tokens stored in Supabase Vault; stated never written to
    application logs, client-side storage, or source code.
  ddos_waf: Cloudflare edge CDN, WAF and DDoS mitigation in front of all public endpoints
  ci_cd: Google Cloud Build with container image scanning
  monitoring: >-
    Real-time monitoring of application errors, tool-execution failures and
    security-relevant events, alerting engineering via Slack.
