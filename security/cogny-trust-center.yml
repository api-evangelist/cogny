name: Cogny Security
type: security-page
note: >-
  Cogny publishes a single self-hosted security page rather than a third-party
  trust portal (no Vanta/Drata/SafeBase surface, no trust.cogny.com — probed,
  404). The page is substantive: encryption posture, auth model, tenant
  isolation, GDPR handling, infrastructure, a named sub-processor register, and
  monitoring/incident response.
attestation_correction: >-
  IMPORTANT — a keyword probe of this page matches "SOC 2" and "ISO 27001", but
  BOTH strings occur only inside the DeepInfra, Inc. row of the sub-processor
  register ("Zero data-retention policy; SOC 2 and ISO 27001 certified"). They
  describe a SUB-PROCESSOR, not Cogny AB. Cogny publishes no SOC 2 report, no
  ISO 27001 certificate, and no PCI/HIPAA/FedRAMP claim anywhere on its public
  surface. Recording those certifications against Cogny would be a false
  attribution, so they are held below under third_party_certifications only.
